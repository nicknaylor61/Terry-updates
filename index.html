<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Terry knocks the bastard off</title>
<meta name="description" content="Updates on Terry's care, posted roughly weekly.">
<style>
  :root{
    --paper:#F6F4EF; --card:#FFFFFF; --ink:#2B2A26; --ink-soft:#6B6A63; --ink-faint:#9B998F;
    --line:#E4E1D6; --accent:#3E5C58; --accent-soft:#E4ECE9; --accent-strong:#2C4441;
    --radius:10px; --serif:'Iowan Old Style','Georgia','Charter',serif;
    --sans:-apple-system, BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--paper); color:var(--ink); font-family:var(--sans); font-size:16px; line-height:1.65;}
  .wrap{max-width:640px; margin:0 auto; padding:48px 20px 90px;}
  h1{font-family:var(--serif); font-weight:400; font-size:32px; margin:0 0 6px; color:var(--accent-strong);}
  .lede{color:var(--ink-soft); font-size:14px; margin:0 0 44px;}
  .post{padding-bottom:32px; margin-bottom:32px; border-bottom:1px solid var(--line);}
  .post:last-child{border-bottom:none;}
  .post-date{font-size:12.5px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:0.04em; margin-bottom:6px;}
  .post-title{font-family:var(--serif); font-size:23px; margin:0 0 10px; color:var(--ink);}
  .post-body{font-size:16px; color:var(--ink); white-space:pre-wrap;}
  .empty{color:var(--ink-faint); font-size:15px; padding:40px 0; text-align:center;}
  footer{margin-top:50px; text-align:center; font-size:12px; color:var(--ink-faint);}
</style>
</head>
<body>
<div class="wrap">
  <h1>Terry knocks the bastard off</h1>
  <p class="lede">Updates on how things are going, posted roughly weekly.</p>
  <div id="posts"><div class="empty">Loading updates…</div></div>
  <footer>To add or edit posts, see /posts/ in the site's GitHub repository.</footer>
</div>

<script>
function fmtDate(d){
  if(!d) return '';
  const dt = new Date(d + 'T00:00:00');
  return dt.toLocaleDateString('en-NZ', {day:'numeric', month:'long', year:'numeric'});
}

fetch('posts/manifest.json')
  .then(r => r.json())
  .then(list => {
    // list is an array of filenames, newest should be listed first in manifest.json
    return Promise.all(list.map(fname => fetch('posts/' + fname).then(r => r.json())));
  })
  .then(posts => {
    posts.sort((a,b) => (b.date||'').localeCompare(a.date||''));
    const el = document.getElementById('posts');
    if(posts.length === 0){
      el.innerHTML = '<div class="empty">No updates posted yet — check back soon.</div>';
      return;
    }
    el.innerHTML = posts.map(p => `
      <div class="post">
        <div class="post-date">${fmtDate(p.date)}</div>
        <div class="post-title">${p.title}</div>
        <div class="post-body">${p.body}</div>
      </div>
    `).join('');
  })
  .catch(() => {
    document.getElementById('posts').innerHTML = '<div class="empty">No updates posted yet — check back soon.</div>';
  });
</script>
</body>
</html>
