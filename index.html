<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Terry Updates</title>
<meta name="description" content="Updates on how Terry's doing.">
<style>
  :root{
    --paper:#F6F4EF; --card:#FFFFFF; --ink:#2B2A26; --ink-soft:#6B6A63; --ink-faint:#9B998F;
    --line:#E4E1D6; --accent:#3E5C58; --accent-soft:#E4ECE9; --accent-strong:#2C4441;
    --radius:10px; --serif:'Iowan Old Style','Georgia','Charter',serif;
    --sans:-apple-system, BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--paper); color:var(--ink); font-family:var(--sans); font-size:16px; line-height:1.65;}
  .wrap{max-width:900px; margin:0 auto; padding:48px 20px 90px;}
  h1{font-family:var(--serif); font-weight:400; font-size:32px; margin:0 0 6px; color:var(--accent-strong);}
  .lede{color:var(--ink-soft); font-size:14px; margin:0 0 36px;}
  .layout{display:grid; grid-template-columns:1fr 260px; gap:40px; align-items:start;}
  @media (max-width: 720px){
    .layout{grid-template-columns:1fr;}
    .signup{order:-1; margin-bottom:36px;}
  }
  .signup{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:16px 18px; position:sticky; top:24px;}
  .signup p{margin:0 0 10px; font-size:13px; color:var(--ink-soft);}
  .signup-row{display:flex; flex-direction:column; gap:8px;}
  .signup input[type=email]{
    font-family:var(--sans); font-size:14px; padding:9px 11px;
    border:1px solid var(--line); border-radius:6px; background:var(--paper); color:var(--ink);
  }
  .signup button{
    font-size:13.5px; padding:9px 16px; border-radius:6px; border:1px solid var(--accent);
    background:var(--accent); color:#fff; cursor:pointer; font-weight:500;
  }
  .signup button:hover{background:var(--accent-strong);}
  .signup-note{font-size:11.5px; color:var(--ink-faint); margin:8px 0 0;}
  .post{padding-bottom:32px; margin-bottom:32px; border-bottom:1px solid var(--line);}
  .post:last-child{border-bottom:none;}
  .post-date{font-size:12.5px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:0.04em; margin-bottom:6px;}
  .post-title{font-family:var(--serif); font-size:23px; margin:0 0 10px; color:var(--ink);}
  .post-body{font-size:16px; color:var(--ink); white-space:pre-wrap;}
  .post-photos{display:flex; flex-wrap:wrap; gap:10px; margin-top:16px;}
  .post-photos img{width:100%; max-width:280px; border-radius:8px; object-fit:cover; border:1px solid var(--line);}
  .empty{color:var(--ink-faint); font-size:15px; padding:40px 0; text-align:center;}
  footer{margin-top:50px; text-align:center; font-size:12px; color:var(--ink-faint);}
</style>
</head>
<body>
<div class="wrap">
  <h1>Terry Updates</h1>
  <p class="lede">Updates on how things are going.</p>

  <div class="layout">
    <div>
      <div id="posts"><div class="empty">Loading updates…</div></div>
      <footer>To add or edit posts, edit the .json files in this GitHub repository.</footer>
    </div>

    <div class="signup">
      <p>Want new updates emailed to you? Leave your email below.</p>
      <form class="signup-row" name="email-signup" method="POST" data-netlify="true" netlify-honeypot="bot-field">
        <input type="hidden" name="form-name" value="email-signup">
        <p style="display:none;"><label>Don't fill this out: <input name="bot-field"></label></p>
        <input type="email" name="email" placeholder="your@email.com" required>
        <button type="submit">Notify me</button>
      </form>
      <p class="signup-note">Emails are sent out manually when a new update is posted, not automatically.</p>
    </div>
  </div>
</div>

<script>
function fmtDate(d){
  if(!d) return '';
  const dt = new Date(d + 'T00:00:00');
  return dt.toLocaleDateString('en-NZ', {day:'numeric', month:'long', year:'numeric'});
}

fetch('manifest.json')
  .then(r => r.json())
  .then(list => {
    return Promise.all(list.map(fname => fetch(fname).then(r => r.json())));
  })
  .then(posts => {
    posts.sort((a,b) => (b.date||'').localeCompare(a.date||''));
    const el = document.getElementById('posts');
    if(posts.length === 0){
      el.innerHTML = '<div class="empty">No updates posted yet — check back soon.</div>';
      return;
    }
    el.innerHTML = posts.map(p => `
      <div class="post">
        <div class="post-date">${fmtDate(p.date)}</div>
        <div class="post-title">${p.title}</div>
        <div class="post-body">${p.body}</div>
        ${(p.images && p.images.length) ? `<div class="post-photos">${p.images.map(img => `<img src="${img}" alt="">`).join('')}</div>` : ''}
      </div>
    `).join('');
  })
  .catch(() => {
    document.getElementById('posts').innerHTML = '<div class="empty">No updates posted yet — check back soon.</div>';
  });
</script>
</body>
</html>
